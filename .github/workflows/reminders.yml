name: Reminders

# Calls the app's reminder endpoint every 15 minutes (Vercel's free plan only allows a
# daily cron). Set repository secrets APP_URL (e.g. https://stakers.vercel.app) and
# CRON_SECRET (same value as the Vercel env var). Without them, the job skips itself.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET not set — skipping."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
